apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gitops-platform-demo
spec:
  rules:
    - host: gitops.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gitops-platform-demo
                port:
                  number: 80
